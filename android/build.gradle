group = "com.mediquo.mediquo_flutter"
version = "2.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.1.1"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://mediquo.jfrog.io/artifactory/android-sdk" }
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.mediquo.mediquo_flutter"
    // The MediQuo 26.x AAR declares minCompileSdk=37.
    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 29
        consumerProguardFiles "consumer-rules.pro"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

def mediquoSdkVersion = project.findProperty("mediquo.sdkVersion") ?: "26.8.1"

dependencies {
    implementation "com.mediquo:mediquo-sdk:$mediquoSdkVersion"
    // The SDK's POM only exposes these at runtime scope; the bridge compiles
    // against them directly.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.core:core-ktx:1.17.0"

    constraints {
        // The SDK declares firebase-analytics-ktx without a version and relies on
        // firebase-bom 33.x. When the app resolves a newer firebase-bom (34.x,
        // e.g. via firebase_core 4.x), that BOM no longer lists the -ktx modules
        // and the dependency cannot be resolved; this pins the last release.
        implementation "com.google.firebase:firebase-analytics-ktx:22.4.0"
    }
}
